<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Реабілітаційна мережа Одещини на мапі</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --bg:#EDF1F0; --ink:#13232E; --muted:#56666F; --faint:#8A989F;
  --sea:#D3E3E8; --land:#FAFBF7; --nb:#E6EBE6; --line:#AFC0C4; --rule:#CBD6D8;
  --story:#F7F9F8;
  --c-k:#2B66C8; --c-d:#0D6E61; --c-p:#E0922C; --c-kl:#8A5CB8; --c-f:#7F8D94; --c-n:#A7B2B7;
  --p25:#E0262B; --p53:#2B66C8; --p54:#E0922C; --danger:#C3352B; --ok:#0D6E61;
  --dim:#BCC7CB;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1920; --ink:#E5EDEF; --muted:#9DB0B7; --faint:#6E838B;
    --sea:#0A1318; --land:#18272F; --nb:#122028; --line:#33505C; --rule:#24363F;
    --story:#111E25;
    --c-k:#5B91EA; --c-d:#2BB39F; --c-p:#F0A846; --c-kl:#B08AE0; --c-f:#8D9CA3; --c-n:#5C6C73;
    --p25:#FF6B6B; --p53:#5B91EA; --p54:#F0A846; --danger:#F0675B; --ok:#2BB39F; --dim:#2C3E47;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0E1920; --ink:#E5EDEF; --muted:#9DB0B7; --faint:#6E838B;
    --sea:#0A1318; --land:#18272F; --nb:#122028; --line:#33505C; --rule:#24363F;
    --story:#111E25;
    --c-k:#5B91EA; --c-d:#2BB39F; --c-p:#F0A846; --c-kl:#B08AE0; --c-f:#8D9CA3; --c-n:#5C6C73;
    --p25:#FF6B6B; --p53:#5B91EA; --p54:#F0A846; --danger:#F0675B; --ok:#2BB39F; --dim:#2C3E47;
    color-scheme: dark;
}
html{height:100%;font-size:clamp(16px,1.06vw,23px);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:1.000rem;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c-k);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(400px,37%) 1fr;height:100%}
.story{background:var(--story);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;position:relative;z-index:2}
.brand{display:flex;align-items:center;justify-content:space-between;padding:20px 32px 0;color:var(--muted);font-size:0.794rem}
.brand b{font-weight:600;color:var(--ink)}
.slide-wrap{flex:1;overflow-y:auto;padding:24px 32px 24px;min-height:0}
.slide{animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{font-size:0.824rem;color:var(--muted);margin:0 0 10px}
h1,h2{font-family:"Unbounded","Onest",system-ui,sans-serif;font-weight:500;letter-spacing:-.01em;margin:0 0 16px}
h1{font-size:clamp(30px,3vw,56px);line-height:1.12}
h2{font-size:clamp(24px,2.25vw,42px);line-height:1.18}
p{margin:0 0 .85em;max-width:62ch}
.lead{font-size:1.088rem}
.muted{color:var(--muted)}
.small{font-size:0.824rem}
.num{font-family:"Unbounded","Onest",sans-serif;font-weight:500;font-variant-numeric:tabular-nums}
.big{display:grid;grid-template-columns:1fr 1fr;gap:22px 24px;margin:22px 0}
.big div{border-top:2px solid var(--ink);padding-top:10px}
.big .num{font-size:clamp(38px,3.9vw,68px);line-height:1;display:block;margin-bottom:6px}
.big span.l{font-size:0.853rem;color:var(--muted);line-height:1.35;display:block}
.speaker{margin-top:28px;padding-top:16px;border-top:1px solid var(--rule)}
.speaker b{display:block;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:0.853rem;margin:10px 0 16px}
th{font-weight:500;color:var(--muted);text-align:left;padding:6px 6px 6px 0;border-bottom:1px solid var(--rule);font-size:0.765rem}
td{padding:8px 6px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:color-mix(in srgb,var(--c-k) 8%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px 6px 10px;font-size:0.824rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--story)}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.pk{display:inline-block;font-size:0.706rem;font-weight:600;padding:1px 7px;border-radius:5px;color:#fff;margin-right:4px;font-variant-numeric:tabular-nums}
.pk25{background:var(--p25)} .pk53{background:var(--p53)} .pk54{background:var(--p54);color:#2a1a05}
.list{margin:8px 0 12px;padding:0;list-style:none}
.list li{padding:9px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:0.853rem;line-height:1.35}
.list li:hover .nm{text-decoration:underline}
.list .nm{font-weight:500}
.list .ad{color:var(--muted);font-size:0.765rem;display:block;margin-top:2px}
.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:0.794rem;color:var(--muted);margin:6px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.yr{display:flex;align-items:center;gap:14px;margin:18px 0 6px}
.yr input{flex:1;accent-color:var(--c-k)}
.yr .num{font-size:2.8rem;min-width:3.3ch}
.play{border:1.5px solid var(--ink);background:transparent;border-radius:999px;width:42px;height:42px;cursor:pointer;display:grid;place-items:center;flex:none}
.hist{display:flex;align-items:flex-end;gap:3px;height:90px;margin:10px 0 2px}
.hist i{flex:1;background:var(--dim);border-radius:2px 2px 0 0;position:relative;transition:background .2s}
.hist i.on{background:var(--c-k)}
.hist i.cur{background:var(--ink)}
.histx{display:flex;justify-content:space-between;font-size:0.706rem;color:var(--faint)}
.prio{counter-reset:p;list-style:none;padding:0;margin:10px 0}
.prio li{counter-increment:p;padding:12px 0 12px 44px;border-bottom:1px solid var(--rule);position:relative}
.prio li::before{content:counter(p);position:absolute;left:0;top:10px;font-family:"Unbounded",sans-serif;font-size:1.294rem;color:var(--c-k)}
.prio b{font-weight:600}
.search{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--land);color:var(--ink);font:inherit;font-size:0.882rem;margin:6px 0 10px}
.nav{display:flex;align-items:center;gap:10px;padding:14px 32px 18px;border-top:1px solid var(--rule)}
.nav button.arrow{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;cursor:pointer;display:grid;place-items:center;flex:none}
.nav button.arrow:disabled{opacity:.3;cursor:default}
.rail{flex:1;display:flex;gap:3px;align-items:center;min-width:0}
.rail button{flex:1;height:22px;border:0;background:transparent;cursor:pointer;padding:0;position:relative}
.rail button::after{content:"";position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--dim)}
.rail button.done::after{background:var(--faint)}
.rail button.cur::after{background:var(--ink);height:6px;top:8px}
.counter{font-size:0.765rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.mapbox{position:relative;min-width:0;min-height:0;background:var(--sea);overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.land{fill:var(--land);stroke:var(--line);stroke-width:1.2;vector-effect:non-scaling-stroke}
.wl{fill:var(--nb);stroke:var(--line);stroke-width:.6;vector-effect:non-scaling-stroke}
.nb{fill:var(--nb);stroke:var(--line);stroke-width:.8;vector-effect:non-scaling-stroke}
.ray{fill:var(--land);stroke:none;cursor:pointer;transition:fill .5s}
.ray:hover{fill:color-mix(in srgb,var(--c-k) 10%,var(--land))}
.hrom{fill:none;stroke:var(--rule);stroke-width:.6;vector-effect:non-scaling-stroke;pointer-events:none}
.rayb{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:1.4;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
.cityb{fill:none;stroke:var(--c-k);stroke-width:1.4;stroke-dasharray:4 3;vector-effect:non-scaling-stroke;pointer-events:none}
.rlab text{fill:var(--ink);font-family:"Unbounded","Onest",sans-serif;font-weight:500;text-anchor:middle;paint-order:stroke;stroke:var(--land);stroke-linejoin:round;pointer-events:none;opacity:.8}
.rlab text.c{font-family:"Onest",sans-serif;font-weight:500;fill:var(--muted);opacity:1}
.town text{fill:var(--muted);paint-order:stroke;stroke:var(--land);stroke-linejoin:round}
.town circle{fill:var(--muted)}
.town text.sea{fill:var(--faint);font-style:italic;stroke:none;letter-spacing:.04em}
.pt{cursor:pointer;transition:opacity .35s, fill .35s}
.pt.sel{stroke:var(--ink)!important}
.bub circle{fill:color-mix(in srgb,var(--c-k) 22%,transparent);stroke:var(--c-k);stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer}
.bub text{font-family:"Unbounded",sans-serif;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--land);stroke-linejoin:round;pointer-events:none}
.hood text{fill:var(--muted);opacity:.85;font-weight:600;letter-spacing:.02em;paint-order:stroke;stroke:var(--land);stroke-linejoin:round;pointer-events:none}
.lbl text{fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-linejoin:round;pointer-events:none;font-weight:500}
.pulse{fill:none;stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
.tools{position:absolute;top:16px;right:16px;display:flex;gap:8px;z-index:3}
.tools button{height:38px;min-width:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--land);cursor:pointer;font-size:0.824rem;display:inline-flex;align-items:center;gap:6px}
.maptitle{position:absolute;left:20px;top:16px;z-index:3;font-size:0.824rem;color:var(--muted);background:color-mix(in srgb,var(--land) 85%,transparent);padding:6px 10px;border-radius:6px;max-width:calc(100% - 300px)}
.maptitle b{color:var(--ink);font-weight:600}
.card{position:absolute;left:20px;bottom:20px;z-index:4;width:min(400px,calc(100% - 40px));background:var(--land);border:1px solid var(--line);border-radius:12px;padding:16px 18px 14px;box-shadow:0 10px 30px rgba(10,25,35,.18);display:none}
.card.show{display:block;animation:in .25s ease both}
.card h3{font-size:0.941rem;line-height:1.3;margin:0 28px 6px 0;font-weight:600}
.card .x{position:absolute;right:10px;top:8px;border:0;background:transparent;font-size:1.294rem;cursor:pointer;color:var(--muted);line-height:1;padding:4px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 4px;font-size:0.794rem}
.card dt{color:var(--muted)} .card dd{margin:0}
.warn{color:var(--danger);font-weight:500}
.notes{position:absolute;right:16px;top:64px;z-index:5;width:min(420px,calc(100% - 32px));max-height:60%;overflow:auto;background:var(--ink);color:var(--story);border-radius:12px;padding:16px 18px;font-size:0.882rem;display:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.notes.show{display:block}
.notes h4{margin:0 0 6px;font-size:0.765rem;font-weight:500;opacity:.7}
.foot{position:absolute;right:16px;bottom:12px;z-index:3;font-size:0.706rem;color:var(--muted);background:color-mix(in srgb,var(--land) 80%,transparent);padding:3px 8px;border-radius:5px;max-width:60%;text-align:right}
.zoomctl{position:absolute;right:16px;bottom:64px;z-index:3;display:flex;flex-direction:column;gap:6px}
.zoomctl button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--land);cursor:pointer;font-size:1.059rem}
@media (max-width: 900px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:auto 56vh;height:auto;min-height:100%}
  .story{border-right:0;border-bottom:1px solid var(--rule);order:1}
  .mapbox{order:2;height:56vh}
  .slide-wrap{overflow:visible}
  .maptitle{max-width:calc(100% - 140px)}
  .tools .lbl-t{display:none}
}
@media (prefers-reduced-motion: reduce){ .slide,.card.show{animation:none} .pt{transition:none} }
.logo{display:block;width:min(15rem,62%);height:auto;margin:0 0 1.4rem}
.logo.w{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo.n{display:none}:root:not([data-theme="light"]) .logo.w{display:block}}
:root[data-theme="dark"] .logo.n{display:none}:root[data-theme="dark"] .logo.w{display:block}
</style>
</head>
<body>
<div class="app">
  <section class="story" aria-live="polite">
    <div class="brand"><span><b>Департамент охорони здоров'я</b> Одеської ОДА</span><span class="counter" id="counter"></span></div>
    <div class="slide-wrap" id="slideWrap"><div class="slide" id="slide"></div></div>
    <div class="nav">
      <button class="arrow" id="prev" aria-label="Попередній слайд"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="rail" id="rail"></div>
      <button class="arrow" id="next" aria-label="Наступний слайд"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </section>
  <section class="mapbox" aria-label="Мапа закладів">
    <div class="maptitle" id="maptitle"></div>
    <div class="tools">
      <button id="btnNotes" title="Нотатки доповідача (N)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H8l-4 4z"/></svg><span class="lbl-t">Нотатки</span></button>
      <button id="btnFs" title="На весь екран (F)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lbl-t">Екран</span></button>
    </div>
    <div class="notes" id="notes"></div>
    <svg id="map" role="img" aria-label="Мапа Одеської області з точками закладів"></svg>
    <div class="zoomctl"><button id="zin" aria-label="Наблизити">+</button><button id="zout" aria-label="Віддалити">−</button></div>
    <div class="card" id="card"></div>
    <div class="foot">Точки розміщено наближено за адресою. Дані: ліцензійний реєстр МОЗ (02.10.2026), ЄДР і НСЗУ (03.11.2026)</div>
  </section>
</div>

/* ---------- slide helpers ---------- */
function yearPaint(y){return {filter:d=>d.year<=y,hideOthers:true,color:d=>d.year===y?css("--danger"):(d.own==="П"||d.own==="Кл"||d.own==="Н"||d.fop?css("--c-p"):css("--c-k")),big:d=>d.year===y}}
let timer=null;
function initYear(){
  const h=document.getElementById("hist"); const yrs=d3.range(2010,2027);
  const cnt=yrs.map(y=>by(d=>d.year===y).length), mx=d3.max(cnt);
  h.innerHTML=yrs.map((y,i)=>`<i data-y="${y}" title="${y}: ${cnt[i]} нових адрес" style="height:${Math.max(3,cnt[i]/mx*100)}%"></i>`).join("");
  const inp=document.getElementById("yr");
  const set=y=>{inp.value=y;document.getElementById("yrv").textContent=y;
    h.querySelectorAll("i").forEach(b=>{const by_=+b.dataset.y;b.className=by_===y?"cur":by_<y?"on":""});
    const n=yearCount(y), nn=by(d=>d.year===y), pr=nn.filter(d=>d.own==="П"||d.own==="Кл"||d.fop).length;
    document.getElementById("yrtxt").innerHTML=`<b>${n}</b> адрес діяли на кінець ${y} року. Нових у ${y}: <b>${nn.length}</b>${nn.length?`, з них приватних ${pr}`:""}.`;
    paint(yearPaint(y));};
  inp.oninput=()=>{stop();set(+inp.value)};
  document.getElementById("y18").onclick=()=>{stop();set(2018)}; document.getElementById("y26").onclick=()=>{stop();set(2026)};
  h.querySelectorAll("i").forEach(b=>b.onclick=()=>{stop();set(+b.dataset.y)});
  const btn=document.getElementById("play");
  function stop(){if(timer){clearInterval(timer);timer=null;btn.innerHTML=playIco}}
  const playIco=btn.innerHTML;
  btn.onclick=()=>{ if(timer){stop();return}
    let y=+inp.value>=2026?2010:+inp.value; set(y);
    btn.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>`;
    timer=setInterval(()=>{y++; if(y>2026){stop();return} set(y)},700)};
  set(2018);
}
function ownPaint(){const on=new Set([...document.querySelectorAll("#ownChips .chip[aria-pressed=true]")].map(b=>b.dataset.o));
  if(!document.getElementById("ownChips")){on.add("К");on.add("Д")}
  return {filter:d=>{const g=d.own;return on.has(g)},color:ownColor,big:d=>d.here===2,labels:d=>!d.city,labelText:place}}
function initOwn(){document.querySelectorAll("#ownChips .chip").forEach(b=>b.onclick=()=>{b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true");paint(ownPaint())});paint(ownPaint())}
function pkPaint(){return {filter:d=>d.here===2&&d.pk.some(p=>pkSel.has(p)),color:d=>pkFill(d.pk.filter(x=>pkSel.has(x))),ring25:true,big:d=>d.here===2,labels:d=>!d.city,labelText:place}}
function initPk(){
  const draw=()=>{const a=Array.from(d3.group(by(d=>d.here===2&&d.pk.some(p=>pkSel.has(p))),d=>d.lic).values()).map(v=>({...(v.find(x=>x.here===2)||v[0]),pk:[...new Set(v.flatMap(x=>x.pk))].sort()}));
    a.sort((x,y)=>(x.city-y.city)||x.name.localeCompare(y.name,"uk"));
    document.getElementById("pkList").innerHTML=`<p class="small muted">${a.length} ліцензіатів за вибраними пакетами:</p>`+listHtml(a,d=>` ${pkHtml(d.pk)}`); bindList(); paint(pkPaint())};
  document.querySelectorAll("#pkChips .chip").forEach(b=>b.onclick=()=>{const p=b.dataset.p; if(pkSel.has(p)){if(pkSel.size>1)pkSel.delete(p)}else pkSel.add(p); b.setAttribute("aria-pressed",pkSel.has(p)); draw()});
  document.querySelectorAll("#pkChips .chip").forEach(b=>b.setAttribute("aria-pressed",pkSel.has(b.dataset.p)));
  draw();
}
function initExplore(){
  const f=new Set();
  const run=()=>{const q=document.getElementById("q").value.trim().toLowerCase();
    const m=d=>(!q||(d.name+" "+d.addr+" "+d.hrom+" "+d.code).toLowerCase().includes(q))&&(!f.has("pub")||pub(d))&&(!f.has("pk")||d.here===2)&&(!f.has("obl")||!d.city)&&(!f.has("risk")||["пп","п"].includes(d.edr));
    const a=by(m); paint({filter:m,color:ownColor});
    document.getElementById("exList").innerHTML=`<p class="small muted">Знайдено адрес: ${a.length}</p>`+(a.length<=40?listHtml(a,d=>d.pk.length?` ${pkHtml(d.pk)}`:""):"");
    bindList();
    if(q&&a.length&&a.length<=40) zoomTo(bboxOf(a),700);};
  document.getElementById("q").oninput=run;
  document.querySelectorAll("#exChips .chip").forEach(b=>b.onclick=()=>{const k=b.dataset.f;f.has(k)?f.delete(k):f.add(k);b.setAttribute("aria-pressed",f.has(k));run()});
  run();
}
function bindList(){document.querySelectorAll(".list li").forEach(li=>{li.onclick=()=>flyTo(+li.dataset.n);li.onmouseenter=()=>pulse(D.find(x=>x.n===+li.dataset.n))})}

/* ---------- navigation ---------- */
let cur=0;
const rail=document.getElementById("rail");
rail.innerHTML=SLIDES.map((s,i)=>`<button aria-label="${i+1}. ${s.title}" title="${i+1}. ${s.title}" data-i="${i}"></button>`).join("");
rail.querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.i));
function go(i,fromHash){
  if(timer){clearInterval(timer);timer=null}
  cur=Math.max(0,Math.min(SLIDES.length-1,i)); const s=SLIDES[cur];
  const el=document.getElementById("slide"); el.innerHTML=s.html(); el.style.animation="none"; el.offsetHeight; el.style.animation="";
  document.getElementById("slideWrap").scrollTop=0;
  document.getElementById("counter").textContent=`${cur+1} / ${SLIDES.length}`;
  document.getElementById("maptitle").innerHTML=`<b>${s.title}</b>`;
  rail.querySelectorAll("button").forEach((b,j)=>b.className=j===cur?"cur":j<cur?"done":"");
  document.getElementById("prev").disabled=cur===0; document.getElementById("next").disabled=cur===SLIDES.length-1;
  document.getElementById("notes").innerHTML=`<h4>Нотатки доповідача</h4>${esc(s.notes||"")}`;
  closeCard(); gFx.selectAll("*").remove();
  zoomTo(VIEW[s.map]);
  if(s.reveal && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    paint({filter:()=>false,hideOthers:true}); const yrs=d3.range(2010,2027); let k=0;
    const iv=setInterval(()=>{const y=yrs[k++]; paint({filter:d=>d.year<=y,hideOthers:true,color:()=>css("--c-k")}); if(k>=yrs.length)clearInterval(iv)},110);
  } else paint(s.paint());
  if(s.after) s.after();
  if(!fromHash){ history.replaceState(null,"","#"+s.id) }
}
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
document.addEventListener("keydown",e=>{
  if(e.target.matches("input"))return;
  if(["ArrowRight","PageDown"].includes(e.key)||(e.key===" "&&!e.target.matches("button"))){e.preventDefault();go(cur+1)}
  else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(cur-1)}
  else if(e.key==="Home")go(0); else if(e.key==="End")go(SLIDES.length-1);
  else if(e.key==="n"||e.key==="т"||e.key==="N")toggleNotes();
  else if(e.key==="f"||e.key==="а"||e.key==="F")toggleFs();
  else if(e.key==="Escape")closeCard();
});
function toggleNotes(){document.getElementById("notes").classList.toggle("show")}
function toggleFs(){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}catch(e){}}
document.getElementById("btnNotes").onclick=toggleNotes;
document.getElementById("btnFs").onclick=toggleFs;
document.getElementById("zin").onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,1.6);
document.getElementById("zout").onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,1/1.6);
function fromHash(){const id=location.hash.slice(1);const i=SLIDES.findIndex(s=>s.id===id);return i<0?0:i}
window.addEventListener("hashchange",()=>{const i=fromHash(); if(i!==cur)go(i,true)});
let rt; window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{setup();go(cur,true)},200)});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>paint(state));
setup(); go(fromHash(),true);
</script>
</body>
